# TLS forwarding of authentication logs to IBM TechZone collector

global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ibm-ca-chain.pem"
)

authpriv.* action(
  type="omfwd"
  target="10.11.5.3"
  port="6514"
  protocol="tcp"
  StreamDriver="gtls"
  StreamDriverMode="1"
  StreamDriverAuthMode="x509/name"
  StreamDriverPermittedPeers="mayday"
  Template="RSYSLOG_SyslogProtocol23Format"
)

auth.* action(
  type="omfwd"
  target="10.11.5.3"
  port="6514"
  protocol="tcp"
  StreamDriver="gtls"
  StreamDriverMode="1"
  StreamDriverAuthMode="x509/name"
  StreamDriverPermittedPeers="mayday"
  Template="RSYSLOG_SyslogProtocol23Format"
)
